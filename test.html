<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<title>Moda industriyasi: test va kartalar</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#F4F0EA;--panel:#FFFFFF;--ink:#241C2B;--mut:#6D6475;--line:#E4DBD3;--soft:#F1EAE4;--acc:#7A2A4C;--on:#fff;--teal:#12747F;--ok:#2B7A57;--okbg:#E3F3EA;--bad:#B23B30;--badbg:#FBE7E4;--gold:#C9A04B;
--bar:linear-gradient(90deg,#5B1F52,#8E2F7B 55%,#12747F);--shadow:0 1px 2px rgb(36 28 43/.06),0 8px 24px -12px rgb(36 28 43/.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171219;--panel:#211A25;--ink:#F3ECF1;--mut:#B6AABD;--line:#3A2F3F;--soft:#2A2230;--acc:#E58AB0;--on:#1B1220;--teal:#4CC0CE;--ok:#6CCB9D;--okbg:#1D3328;--bad:#F29186;--badbg:#3A211E;--gold:#E3BE6B;--shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px -12px rgb(0 0 0/.6);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171219;--panel:#211A25;--ink:#F3ECF1;--mut:#B6AABD;--line:#3A2F3F;--soft:#2A2230;--acc:#E58AB0;--on:#1B1220;--teal:#4CC0CE;--ok:#6CCB9D;--okbg:#1D3328;--bad:#F29186;--badbg:#3A211E;--gold:#E3BE6B;--shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px -12px rgb(0 0 0/.6);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Inter Tight",system-ui,sans-serif;padding-inline:16px;padding-block:0 40px}
.app{max-width:760px;margin:0 auto}
h1,h2,.disp{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
h1{font:700 clamp(26px,6vw,38px)/1.1 Fraunces,Georgia,serif;margin:0 0 8px;text-wrap:balance}
h2{font:700 clamp(21px,4.6vw,26px)/1.2 Fraunces,Georgia,serif;margin:0 0 8px;text-wrap:balance}
p{margin:0 0 10px}.mut{color:var(--mut)}.sm{font-size:15px}.xs{font-size:13px}
header.top{position:sticky;top:0;z-index:20;background:var(--bar);margin-inline:-16px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgb(0 0 0/.18)}
.logo{width:26px;height:26px;border-radius:8px;flex:none;background:conic-gradient(from 200deg,#E0A526,#B0214F,#139A9A,#7B4BB7,#E0A526);box-shadow:0 0 0 2px rgb(255 255 255/.5)}
.top b{font:700 17px Fraunces,serif;flex:1;min-width:0}
.top a{color:#fff;text-decoration:none;font:600 14px "Inter Tight";background:rgb(255 255 255/.18);padding:6px 12px;border-radius:999px}
main{padding-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);min-width:0}
.tag{display:inline-block;color:var(--on);background:var(--c,var(--acc));border-radius:999px;padding:3px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--on);border-radius:12px;padding:12px 20px;font:700 16px "Inter Tight";cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--acc)}
.btn:focus-visible,.opt:focus-visible,.fc:focus-visible,.seg button:focus-visible,.tp:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
/* home */
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.tp{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);min-width:0}
.tp .n{flex:none;width:42px;height:42px;border-radius:12px;background:var(--bar);color:#fff;display:grid;place-items:center;font:700 19px Fraunces,serif}
.tp .t{flex:1;min-width:0;font-weight:600;line-height:1.3;font-size:16px}
.tp .s{font-size:13px;color:var(--mut);font-weight:500}
.tp .b{flex:none;font:700 13px "Inter Tight";padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mut)}
.tp .b.g{background:var(--okbg);color:var(--ok)}
/* tabs */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font:700 15px "Inter Tight";padding:10px 8px;border-radius:9px;cursor:pointer;min-height:44px}
.seg button[aria-selected=true]{background:var(--panel);color:var(--acc);box-shadow:0 1px 4px rgb(0 0 0/.15)}
/* quiz */
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--bar);border-radius:99px;transition:width .3s}
.q{font:600 19px/1.4 "Inter Tight";margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px;font:500 16px/1.4 "Inter Tight";cursor:pointer;min-height:52px}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--mut);display:grid;place-items:center;font:700 13px "Inter Tight";margin-top:-1px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15.5px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.score{font:700 56px/1 Fraunces,serif;color:var(--acc);margin:4px 0}
.score small{font-size:24px;color:var(--mut)}
.wr{border-top:1px solid var(--line);padding:10px 0;font-size:15px}.wr:first-of-type{border-top:0}
/* cards */
.fcw{perspective:1200px}
.fc{display:block;width:100%;aspect-ratio:4/3;min-height:230px;border:0;background:none;padding:0;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .5s;color:var(--ink);font:inherit}
.fc.flip{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc .a{background:var(--panel)}
.fc .a span{font:700 clamp(22px,5.5vw,30px)/1.2 Fraunces,serif;text-wrap:balance;color:var(--acc)}
.fc .a em{position:absolute;bottom:12px;font-style:normal;font-size:13px;color:var(--mut)}
.fc .z{transform:rotateY(180deg);background:var(--bar);color:#fff;font-size:17.5px;line-height:1.45;border:0}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.nav .c{font-weight:700;color:var(--mut);font-size:15px}
.mark{display:flex;gap:10px}.mark .btn{flex:1}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.again{background:transparent;border-color:var(--bad);color:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.k{background:var(--ok)}.dots i.r{background:var(--bad)}.dots i.now{outline:2px solid var(--acc);outline-offset:1px}

ff-price", "Taqqoslanadigan mahsulotni odatiy to‘liq chakana narxdan pastroq narxda sotishga asoslangan format."], ["Resale", "Mahsulotning ikkilamchi bozorda qayta sotilishi."], ["Direct-to-Consumer (DTC)", "Brend o‘z do‘koni yoki raqamli kanali orqali mahsulotni bevosita iste’molchiga sotadigan model."], ["Omnichannel", "Jismoniy va raqamli kanallarni izchil xarid tajribasiga bog‘lash strategiyasi."]]}, "3": {"title": "Brending asoslari", "q": [["Brendingning birinchi vazifasi qaysi?", ["Chegirma berish", "Identifikatsiya — xaridor mahsulot kimga tegishli ekanini tanishi", "Ishlab chiqarish hajmini oshirish", "Reklama byudjetini kamaytirish"], 1, "Vazifalar: identifikatsiya, farqlanish, ishonchni mustahkamlash (3.1)."], ["Brend identifikatsiyasi va brend imiji o‘rtasidagi farq nima?", ["Farq yo‘q", "Identifikatsiya rejalashtiriladigan belgilar tizimi; imij — auditoriya ongidagi tasavvur", "Identifikatsiya — auditoriya fikri; imij — logotip", "Identifikatsiya faqat huquqiy tushuncha"], 1, "Imij taklif, aloqa va real tajriba ta’sirida shakllanadi (3.4)."], ["Brend kapitali (brand equity) nima?", ["Kompaniyaning bank hisobidagi mablag‘i", "Nom bilan bog‘langan qo‘shimcha qiymatni tushuntiruvchi tushuncha", "Ro‘yxatdan o‘tgan tovar belgisi soni", "Do‘konlar soni"], 1, "Uni moliyaviy hisobotdagi qiymat yoki brendni pulda baholash bilan aynanlashtirmaslik kerak (3.4)."], ["Keller yondashuviga ko‘ra brend kapitali qanday yuzaga keladi?", ["Logotip shakli orqali", "Brend haqidagi bilim iste’molchining marketingga javobida farq yaratishi orqali", "Faqat narx orqali", "Faqat reklama hajmi orqali"], 1, "Bu iste’molchi bilimiga asoslangan yondashuv (3.3, 3.4)."], ["Ijtimoiy tarmoqda nom bo‘sh ekanligi nimani anglatadi?", ["Tovar belgisidan foydalanish mumkinligini avtomatik tasdiqlaydi", "Tovar belgisidan foydalanish mumkinligini avtomatik tasdiqlamaydi", "Nom huquqiy himoyalangan", "Nom ro‘yxatdan o‘tgan"], 1, "Domen yoki ijtimoiy tarmoq nomining bo‘shligi huquqiy ro‘yxatga olish bilan teng emas (3.5)."], ["American Marketing Association brendni qanday izohlaydi?", ["Mashhur kompaniya sifatida", "Mahsulot yoki xizmatni tanitadigan nom, atama, dizayn yoki ramz kabi farqlovchi xususiyat sifatida", "Iste’molchi xotirasi sifatida", "Soliq to‘lovchi korxona sifatida"], 1, "Bu identifikatsiyaga asoslangan yondashuv (3.3)."], ["O‘zbekiston qonunchiligida rasmiy atama qaysi?", ["Trademark", "Savdo belgisi", "Tovar belgisi", "Brend belgisi"], 2, "Xizmat ko‘rsatish belgisi ham tegishli tartibda qo‘llanadi (3.5)."]], "c": [["Brending", "Mahsulot, xizmat yoki tashkilotni bozorda tanitish, farqlanuvchi qiymatini ifodalash va iste’molchi bilan izchil munosabat shakllantirishga qaratilgan boshqaruv faoliyati."], ["Brend identifikatsiyasi (brand identity)", "Brendni tanitish va ifodalashga xizmat qiladigan belgilar tizimi: nom, logotip, rang, tipografika, yorliq, qadoq."], ["Brend imiji (brand image)", "Auditoriya ongidagi brend haqidagi tasavvurlar."], ["Brend kapitali (brand equity)", "Nom bilan bog‘langan qo‘shimcha qiymatni tushuntiruvchi tushuncha."], ["Savdo belgisi (trademark)", "Bir korxonaning mahsulot yoki xizmatini boshqalarnikidan farqlashga qodir belgi; huquqiy muhofaza bilan bog‘liq."], ["Tovar belgisi", "O‘zbekiston qonunchiligidagi rasmiy atama (xizmat ko‘rsatish belgisi ham tegishli tartibda qo‘llanadi)."], ["Identifikatsiyaga asoslangan yondashuv", "Brendni nom, atama, dizayn yoki ramz kabi farqlovchi xususiyat orqali izohlaydi (AMA)."], ["Iste’molchi bilimiga asoslangan yondashuv", "Brend haqidagi bilim iste’molchining marketingga javobida farq yaratadi (Keller)."]]}, "4": {"title": "Brendingda marketing kommunikatsiyalari", "q": [["Integratsiyalashgan marketing kommunikatsiyalari (IMC) nima?", ["Faqat reklama berish", "Turli vositalarni bir-biriga mos rejalashtirish", "Faqat PR bilan shug‘ullanish", "Narxlarni birlashtirish"], 1, "Izchillik barcha kanallarda bir xil matnni takrorlash emas: asosiy ma’no saqlanadi, ifoda kanalga moslashadi (4.1)."], ["Brend-menejerning asosiy masalasi nima?", ["Barcha reklama va dizaynni yolg‘iz bajarish", "Qarorlar va mas’uliyatni muvofiqlashtirish", "Faqat logotip chizish", "Faqat narx belgilash"], 1, "Uning vakolati korxona hajmiga bog‘liq: kichik biznesda bir xodim bir necha rol bajaradi (4.4)."], ["Kommunikatsiya rejasi nimadan boshlanadi?", ["Kanal tanlashdan", "Auditoriya muammosidan", "Byudjetdan", "Logotipdan"], 1, "Keyin maqsad, asosiy xabar va dalil, kanal, byudjet, muddat va ko‘rsatkichlar belgilanadi (4.5)."], ["Brend natijasi past bo‘lsa, nima qilish kerak?", ["Darhol logotipni almashtirish", "Muammo qayerda ekanini aniqlash: qiymat tushunarsizligi, mahsulot mosligi, narx yoki savdo jarayoni", "Reklamani to‘xtatish", "Brendni yopish"], 1, "Har bir past natija logotipni almashtirishni talab qilmaydi (4.3)."], ["Brif nima uchun kerak?", ["Ijrochilar uchun maqsad, auditoriya, asosiy xabar, dalil, kanal, muddat va cheklovlarni aniq belgilash uchun", "Faqat byudjetni ko‘rsatish uchun", "Mahsulot narxini belgilash uchun", "Soliq hisobotini tuzish uchun"], 0, "“Chiroyli reklama qiling” o‘rniga qanday muammoni hal qilish va qanday natijaga erishish yoziladi (4.4)."], ["Brend yaratishning birinchi bosqichi qaysi?", ["Nom va logotip chizish", "Bozor va auditoriyani o‘rganish", "Reklama kampaniyasini boshlash", "Tovar belgisini sotish"], 1, "Keyin: qiymat taklifi, nom va identifikatsiya, mahsulot va xizmat, sinov, kuzatuv (4.3)."]], "c": [["Marketing kommunikatsiyalari", "Tashkilot taklifini auditoriyaga tushuntirish, qiziqish uyg‘otish va munosabatni davom ettirishga xizmat qiladigan xabarlar hamda aloqa faoliyati."], ["IMC", "Integratsiyalashgan marketing kommunikatsiyalari: turli vositalarni bir-biriga mos rejalashtirish."], ["Farqlanuvchanlik", "Taklifni raqobatchidan ajratish sababi."], ["Tegishlilik", "Brendning muayyan ehtiyojga mosligi."], ["Izchillik", "Turli mahsulot va aloqa nuqtalarida asosiy va’daning saqlanishi."], ["Brend arxitekturasi", "Tashkilot va uning mahsulot nomlari o‘rtasidagi munosabat tizimi."], ["Brend-menejer", "Brend strategiyasi bilan kundalik qarorlar o‘rtasidagi muvofiqlikni ta’minlovchi mutaxassis."], ["Brif", "Ijrochilar uchun maqsad, auditoriya, xabar, dalil, kanal, muddat va cheklovlarni belgilovchi topshiriq."], ["Konversiya", "Bir xil davr va aniq hisoblash bazasida talqin qilinadigan, aloqadan xarid tomon o‘tish ko‘rsatkichi."]]}, "5": {"title": "Lyuks va premium brendlar", "q": [["Qo‘llanmaga ko‘ra, yuqori narx lyuks qiymatini yaratish uchun yetarlimi?", ["Ha, narx yagona mezon", "Yo‘q — narx tizimning bir belgisi, qiymatni madaniy ma’no, g‘oya, mahorat va tajriba ham yaratadi", "Ha, agar mahsulot import bo‘lsa", "Faqat reklama hajmiga bog‘liq"], 1, "Qimmat narx lyuks tizimining belgisi bo‘lishi mumkin, ammo yakka o‘zi lyuks qiymatini yaratmaydi (5.1)."], ["Haute couture haqida qaysi fikr to‘g‘ri?", ["Har qanday qimmat kiyim haute couture hisoblanadi", "Buyurtma asosida tikilgan har bir kiyim couture bo‘ladi", "U individual moslashtirish, ustaxona mahorati va kolleksiya yaratish tizimi bilan bog‘liq", "Faqat tayyor kiyim kolleksiyasi"], 2, "FHCM mezonlari: qo‘l mahorati, personalizatsiya, kolleksiyalar ritmi, ustaxona tajribasi (5.3)."], ["Cheklangan seriya (limited edition) nimani bildiradi?", ["Mahorat kafolatini", "Sifat kafolatini", "Hajmni; u o‘zi sifat yoki mahoratning kafolati emas", "Individual buyurtmani"], 2, "Cheklangan seriya hajmni bildiradi (5.3)."], ["Wiedmann, Hennigs va Siebels lyuks qiymatini qaysi jihatlar orqali o‘rganadi?", ["Moliyaviy, funksional, individual va ijtimoiy", "Faqat moliyaviy va huquqiy", "Texnik va ekologik", "Siyosiy va diniy"], 0, "Bu model xaridor motivlarini tartibga solish uchun ishlatiladi (5.4)."], ["Armani va Versace qiyosi nimani ko‘rsatadi?", ["Lyuks bitta estetik shaklga teng emas — qiymat va’dasi turlicha bo‘lsa, vizual ifodasi ham turlicha", "Versace hamisha qimmatroq", "Armani faqat kosmetika ishlab chiqaradi", "Ikkalasi bir xil estetikaga ega"], 0, "Brendlarni “eng yaxshi” tartibida emas, tarixi, estetikasi va qiymati bo‘yicha qiyoslash kerak (5.2)."], ["Premium kosmetikada yuqori narx haqida qanday xulosa to‘g‘ri?", ["Yuqori narx ta’sirning ustunligini avtomatik isbotlaydi", "Narx kosmetik ta’sirning avtomatik ustunligini isbotlamaydi; da’vo nimaga asoslanganini aniqlash kerak", "Narx har doim sifatga teng", "Kosmetika brend kengayishiga mos emas"], 1, "Foydalanuvchi taassuroti va asbob bilan o‘lchangan natija turli dalillardir (5.5)."]], "c": [["Lyuks brending", "Mahsulotning moddiy xususiyatlari bilan birga madaniy ma’no, ijodiy g‘oya, mahorat va xaridor tajribasini boshqarish."], ["Brendning tarixiy merosi", "Mahsulot yaratilishiga sabab bo‘lgan ehtiyoj, ustaxona tajribasi, takrorlanadigan shakl va materiallar hamda estetik qarorlar bog‘lanishi."], ["Haute couture", "Individual moslashtirish, ustaxona mahorati va kolleksiya yaratish tizimi bilan bog‘liq yo‘nalish."], ["Selektiv distribusiya", "Mahsulotni brend tajribasi va xizmat talablariga mos kanallar orqali taklif qilish."], ["Kirish mahsuloti", "Brend dunyosiga dastlabki kirish vazifasini bajaradigan buyum (masalan, atir yoki kichik aksessuar); past sifatni anglatmaydi."], ["Lyuks qiymatining 4 jihati", "Moliyaviy, funksional, individual va ijtimoiy (Wiedmann, Hennigs, Siebels)."], ["Gabardin", "Burberry tarixidagi mato: 1879-yilda yaratilgan, 1888-yilda patentlangan; trench merosida muhim o‘rin tutadi."], ["Brend kengayishi", "Brend nomini yangi mahsulot toifasiga (masalan, atirga) ko‘chirish; estetik moslik va toifadagi sifat birga baholanadi."]]}, "6": {"title": "O‘zbekiston moda industriyasi va milliy meros", "q": [["Ishlab chiqarish salohiyati va brend o‘rtasidagi farq nima?", ["Farq yo‘q", "Ishlab chiqarish mahsulotni hajm va sifatda tayyorlaydi; brend esa mahsulot kim uchun va nimasi bilan ajralishini tushuntiradi", "Brend faqat tikuvchilikka tegishli", "Ishlab chiqarish faqat reklama bilan bog‘liq"], 1, "Boshqa kompaniya buyurtmasini bajarish tajriba beradi, ammo o‘z brendi mustaqil qarorlarni talab qiladi (6.1)."], ["Ikat texnologiyasi haqida qaysi gap to‘g‘ri?", ["Faqat O‘zbekistonga tegishli", "Iplar to‘qishdan oldin belgilangan tartibda bo‘yaladi; texnologiya turli hududlarda mavjud", "Matoga bosma usulida naqsh tushiriladi", "Faqat kashta usuli"], 1, "Uni faqat bir mamlakatga tegishli umumiy tushuncha deb ko‘rsatish to‘g‘ri emas (6.4)."], ["UNESCO 2017-yilda nimani Yaxshi muhofaza amaliyotlari reyestriga kiritgan?", ["Barcha atlas buyumlarini", "Marg‘ilon hunarmandchilikni rivojlantirish markazining atlas va adras tayyorlash an’anaviy texnologiyalarini asrash dasturini", "Barcha o‘zbek moda brendlarini", "Ikat naqshini"], 1, "Bu sifat sertifikati emas: e’tirof predmeti an’anani asrash dasturi va uning tajribasi (6.4)."], ["Mahalliy moda brendini yaratish nimadan boshlanadi?", ["Logotip chizishdan", "Auditoriya va mahsulot muammosini aniqlashdan", "Do‘kon ochishdan", "Reklama joylashtirishdan"], 1, "Kim qanday vaziyat uchun buyum izlaydi, mavjud taklifda nima yetishmaydi — shu savollardan boshlanadi (6.3)."], ["Hunarmand bilan hamkorlikda nimani kelishish kerak?", ["Faqat xomashyo narxini", "Naqsh tanlovi, material hajmi, muddat, haq va muallifning ko‘rsatilishi", "Faqat reklama matnini", "Hech narsani"], 1, "Ustani faqat xomashyo yetkazuvchisi sifatida ko‘rish uning bilimini chetga suradi (6.4)."], ["Podium namoyishi haqida qanday ehtiyotkorlik kerak?", ["Shahar nomi rasmiy podium maqomini tasdiqlaydi", "Tadbirda qatnashish, rasmiy moda haftaligi taqvimiga kirish va mustaqil namoyish bir xil maqom emas", "Barcha namoyishlar bir xil", "Namoyish savdo natijasini kafolatlaydi"], 1, "Brend haqidagi matnda tadbir nomi, sana, tashkilotchi va ishtirok shakli ko‘rsatiladi (6.5)."]], "c": [["Milliy meros elementlari", "Naqsh (vizual tuzilish), material (moddiy asos) va texnologiya (yaratish usuli) — ularni alohida ajratish kerak."], ["Ikat", "Iplarni to‘qishdan oldin belgilangan tartibda bo‘yash bilan bog‘liq rang berish usuli."], ["Atlas-adras", "O‘zbek an’anaviy matolari; mahalliy ustalar tajribasi, rang va kompozitsiya o‘ziga xos yo‘nalish yaratadi."], ["Talqin usullari", "Milliy elementni to‘g‘ridan-to‘g‘ri ko‘chirish, soddalashtirish yoki yangi vazifaga moslashtirish."], ["Qiymat taklifi (mahalliy brend)", "Mahsulot kimga qanday foyda berishini va shu foydaning dalilini bog‘laydi."], ["Tajriba namunasi", "Tanlangan auditoriya ehtiyojiga mos yaratilib, kiyib ko‘rish yoki foydalanishda sinaladigan birinchi nusxa."], ["Marg‘ilon markazi (UNESCO, 2017)", "Atlas va adras tayyorlash an’anaviy texnologiyalarini asrash dasturi Yaxshi muhofaza amaliyotlari reyestriga kiritilgan."], ["Kapsula", "Buyumlar umumiy g‘oya va foydalanish vaziyati bilan bog‘langan kichik kolleksiya."]]}, "7": {"title": "Merchandayzing", "q": [["Merchandayzing nima?", ["Faqat vitrina bezash", "Mahsulotni xaridor ehtiyojiga mos tanlash, savdoga tayyorlash, joylashtirish va tushunarli taqdim etishga qaratilgan faoliyat", "Faqat reklama berish", "Soliq hisobi"], 1, "Moda biznesida u model, rang, o‘lcham tanlovidan buyumning do‘kon yoki saytda ko‘rinishigacha qarorlarni bog‘laydi (7.1)."], ["Assortiment kengligi va chuqurligi qanday farqlanadi?", ["Kenglik — guruh ichidagi variantlar; chuqurlik — guruhlar soni", "Kenglik — mahsulot guruhlari soni; chuqurlik — guruh ichidagi model, rang va o‘lcham variantlari", "Farq yo‘q", "Kenglik narxga, chuqurlik rangga tegishli"], 1, "Ko‘p toifa taklif qilish har bir xaridorga mos variant mavjudligini anglatmaydi (7.2)."], ["Bitta ko‘ylak 3 rangda va 4 o‘lchamda mavjud bo‘lsa, nechta SKU (variant) bo‘ladi?", ["7", "12", "3", "4"], 1, "3 × 4 = 12 ta variant — model soni va zaxira birliklarini farqlash uchun (7.2)."], ["Planogramma nima?", ["Reklama rejasi", "Mahsulotning savdo uskunasida qanday joylashishini ko‘rsatuvchi reja", "Moliyaviy hisobot", "Ishlab chiqarish grafigi"], 1, "U taqdimotni izchil saqlashga yordam beradi, ammo kuzatuv va yangi zaxira asosida yangilanadi (7.2)."], ["Sotilish ulushi: 60 dona sotilib, 40 dona qolsa, ulush qancha?", ["40%", "60%", "100%", "150%"], 1, "60 / (60 + 40) × 100 = 60% (7.5)."], ["Do‘konda 200 tashrif va 40 xarid qayd etilgan bo‘lsa, konversiya qancha?", ["20%", "40%", "5%", "80%"], 0, "40 / 200 × 100 = 20% (7.5). Tashrif va xarid birligi mos bo‘lishi shart."]], "c": [["Merchandayzing", "Mahsulotni xaridor ehtiyojiga mos tanlash, savdoga tayyorlash, joylashtirish va tushunarli taqdim etish faoliyati."], ["Assortiment kengligi", "Taklif etiladigan mahsulot guruhlari soni (ko‘ylak, shim, ustki kiyim, aksessuar)."], ["Assortiment chuqurligi", "Guruh ichidagi model, rang va o‘lcham variantlari."], ["SKU", "Tashkilotning zaxirani ajratib kuzatish uchun ishlatadigan ichki kodi (variant birligi)."], ["Planogramma", "Mahsulot yoki guruhning savdo uskunasida qanday joylashishini ko‘rsatuvchi reja."], ["Vizual merchandayzing", "Mahsulotning shakli, rangi va foydalanish imkoniyatini savdo muhitida tushunarli ko‘rsatish."], ["Raqamli merchandayzing", "Onlayn katalogda mahsulotni topish, qiyoslash va xarid qilishga yordam berish."], ["Sotilish ulushi", "Sotilgan dona sonining (sotilgan + qolgan) dona yig‘indisiga nisbati."]]}, "8": {"title": "Brendlar kollaboratsiyasi", "q": [["Brendlar kollaboratsiyasi nima?", ["Bir brendning ikki xil nomi", "Ikki yoki undan ortiq brendning kelishilgan maqsad asosida mahsulot, xizmat, tajriba yoki kommunikatsiya loyihasini birgalikda yaratishi", "Faqat ikki logotipni yonma-yon qo‘yish", "Mahsulotni arzonlashtirish"], 1, "Har bir tomonning hissasi va javobgarligi aniqlanadi (8.1)."], ["Hamkor tanlashda yetarli mezon qaysi?", ["Faqat obunachilar soni", "Faqat mashhurlik", "Xaridorlar ehtiyoji, narx kutishi, uslubga munosabati, ishlab chiqarish quvvati va sifat nazorati", "Faqat logotipning chiroyi"], 2, "Ikki logotipni yonma-yon qo‘yish yakuniy mahsulot afzalligini ko‘rsatmaydi (8.2)."], ["Har bir kapsula kolleksiyasi kollaboratsiyami?", ["Ha, har doim", "Yo‘q — kapsulani mustaqil brend ham yaratishi mumkin", "Faqat lyuksda", "Faqat cheklangan seriyada"], 1, "Hamkorlik kapsulasida umumiy g‘oya, tarkib va tomonlar hissasi ko‘rsatiladi (8.2)."], ["Schiaparelli va Dalí hamkorligi qaysi turdagi misol?", ["Ikki tijorat brendining qo‘shma mahsuloti", "Rassomning tasviriy g‘oyasi kiyim dizayniga kiritilgan ijodiy hamkorlik", "Litsenziyalash", "Brend elchisi kampaniyasi"], 1, "1937-yil yozgi haute couture kolleksiyasidagi omar tasvirli libos (8.3)."], ["Prada–adidas hamkorligida e’lon va Re-Nylon bosqichi qaysi yillarga tegishli?", ["Ikkalasi ham 2019", "E’lon — 2019, Re-Nylon — 2022", "E’lon — 2022, Re-Nylon — 2019", "Ikkalasi ham 2003"], 1, "Tarixni yozishda barcha mahsulotlarni bitta yilga birlashtirmaslik kerak (8.3)."], ["120 dona kapsuladan 90 donasi sotilgan bo‘lsa, sotilish ulushi qancha?", ["30%", "75%", "90%", "120%"], 1, "90 / 120 × 100 = 75% (8.5). Qolgan 30 dona qaysi model va o‘lchamga tegishli ekanini ham bilish kerak."]], "c": [["Brendlar kollaboratsiyasi", "Ikki yoki undan ortiq brendning kelishilgan maqsad asosida mahsulot, xizmat, tajriba yoki kommunikatsiya loyihasini birgalikda yaratishi."], ["Qo‘shma brending", "Odatda bir taklifda ikki brend identifikatsiyasidan foydalanish."], ["Litsenziyalash", "Belgi yoki dizayndan foydalanish huquqini berish; birgalikda mahsulot yaratishni albatta anglatmaydi."], ["Brend elchisi", "Mahsulotni tanitadi, ammo har doim uni loyihalashda qatnashmaydi (hammuallif emas)."], ["Kapsula kolleksiyasi", "Cheklangan miqdordagi o‘zaro uyg‘un buyumlar to‘plami; mustaqil brend ham yarata oladi."], ["Cheklangan seriya", "Ishlab chiqarish miqdori yoki taklif davrini bildiradi; sifat va talab kafolati emas."], ["Kollaboratsiya brifi", "Maqsad, auditoriya, mahsulot tarkibi, g‘oya, tomonlar hissasi, muddat, xarajat va savdo kanalini belgilaydi."], ["Yangi mijozlar ulushi", "Davrdagi noyob xaridorlar ichida brenddan birinchi marta xarid qilganlar ulushi (24/80 = 30%)."]]}, "9" function shuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  $('#hb').textContent=k+'-mavzu';$('#home').hidden=false;document.title=k+'-mavzu: '+T.title;
  draw()}
function ordered(){const T=DATA[st.k];return T.q.map((q,idx)=>{const order=shuffle([0,1,2,3],st.k*1000+idx*7+st.attempt*13+1);return{q:q[0],o:order.map(i=>q[1][i]),a:order.indexOf(q[2]),e:q[3]}})}
function draw(){
  const T=DATA[st.k];
  if(!st.Q)st.Q=ordered();
  const tabs=`<div class="seg" role="tablist"><button role="tab" aria-selected="${st.tab==='test'}" data-tab="test">Mini-test (${T.q.length})</button><button role="tab" aria-selected="${st.tab==='cards'}" data-tab="cards">Kartalar (${T.c.length})</button></div>`;
  $('#v').innerHTML=`<div class="card" style="padding-bottom:6px"><span class="tag">${st.k}-mavzu</span><h2>${esc(T.title)}</h2>${tabs}</div>`+(st.tab==='test'?quiz():cards());
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;draw();window.scrollTo(0,0)});
  bind();}
function quiz(){
  const Q=st.Q;
  if(st.done){
    const n=Q.length,msg=st.score===n?'Ajoyib! Mavzu yaxshi o‘zlashtirilgan.':st.score>=n-2?'Yaxshi natija. Xatolarni ko‘rib chiqing.':'Mavzuni qayta o‘qib, kartalar bilan takrorlang.';
    return `<div class="card"><h3 class="mut xs" style="margin:0;letter-spacing:.1em;text-transform:uppercase">Natija</h3><div class="score">${st.score}<small>/${n}</small></div><p><b>${msg}</b></p>
    ${st.wrong.length?`<p class="xs mut" style="margin:14px 0 4px">XATOLAR TAHLILI</p>${st.wrong.map(w=>`<div class="wr"><b>${esc(w.q)}</b><br><span style="color:var(--ok)">To‘g‘ri javob: ${esc(w.right)}</span><br><span class="mut">${esc(w.e)}</span></div>`).join('')}`:'<p class="mut">Hamma savolga to‘g‘ri javob berdingiz.</p>'}
    <div class="row" style="margin-top:14px"><button class="btn" id="retry">Qayta urinish</button><button class="btn ghost" id="tocards">Kartalar</button><a class="btn ghost" href="#" style="text-decoration:none;display:inline-grid;place-items:center">Boshqa mavzu</a></div></div>`}
  const q=Q[st.i],ans=st.picked!==null;
  return `<div class="card"><div class="xs mut" style="display:flex;justify-content:space-between"><b>Savol ${st.i+1} / ${Q.length}</b><span>To‘g‘ri: ${st.score}</span></div><div class="prog"><i style="width:${(st.i+(ans?1:0))/Q.length*100}%"></i></div>
  <p class="q">${esc(q.q)}</p><div class="opts">${q.o.map((o,i)=>`<button class="opt ${ans?(i===q.a?'ok':(i===st.picked?'no':'')):''}" data-o="${i}" ${ans?'disabled':''}><span class="k">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  ${ans?`<div class="fb ${st.picked===q.a?'ok':'no'}" role="status"><b>${st.picked===q.a?'To‘g‘ri!':'Noto‘g‘ri.'}</b>${esc(q.e)}</div><div class="row" style="margin-top:14px"><button class="btn" id="next">${st.i+1<Q.length?'Keyingi savol →':'Natijani ko‘rish'}</button></div>`:''}</div>`}
function cards(){
  const C=DATA[st.k].c,c=C[st.ci],kn=st.know,nk=Object.values(kn).filter(v=>v==='k').length;
  return `<div class="card"><div class="xs mut" style="display:flex;justify-content:space-between"><b>Karta ${st.ci+1} / ${C.length}</b><span>Bildim: ${nk} / ${C.length}</span></div>
  <div class="fcw" style="margin-top:10px"><button class="fc ${st.flip?'flip':''}" id="fc" aria-label="Kartani aylantirish"><span class="f a"><span>${esc(c[0])}</span><em>Ta’rifni ko‘rish uchun bosing</em></span><span class="f z">${esc(c[1])}</span></button></div>
  <div class="mark" style="margin-top:14px"><button class="btn again" data-k="r">Takrorlayman</button><button class="btn good" data-k="k">Bildim</button></div>
  <div class="nav"><button class="btn ghost" id="pv" ${st.ci===0?'disabled':''}>← Oldingi</button><span class="c"></span><button class="btn ghost" id="nx" ${st.ci===C.length-1?'disabled':''}>Keyingi →</button></div>
  <div class="dots">${C.map((_,i)=>`<i class="${kn[i]==='k'?'k':kn[i]==='r'?'r':''} ${i===st.ci?'now':''}"></i>`).join('')}</div>
  <div class="row" style="margin-top:14px;justify-content:center"><button class="btn ghost" id="shf" style="min-height:40px;padding:8px 16px;font-size:14px">Kartalarni aralashtirish</button></div></div>`}
function save(){const R=LS.get();R[st.k]=Object.assign(R[st.k]||{},{know:st.know});LS.set(R)}
function bind(){
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const q=st.Q[st.i];st.picked=+b.dataset.o;if(st.picked===q.a)st.score++;else st.wrong.push({q:q.q,right:q.o[q.a],e:q.e});draw()});
  const nx=$('#next');if(nx)nx.onclick=()=>{if(st.i+1<st.Q.length){st.i++;st.picked=null;draw()}else{st.done=true;const R=LS.get();const r=R[st.k]||{};r.best=Math.max(r.best||0,st.score);R[st.k]=r;LS.set(R);draw()}window.scrollTo(0,0)};
  const rt=$('#retry');if(rt)rt.onclick=()=>{st.attempt++;st.Q=ordered();st.i=0;st.score=0;st.wrong=[];st.done=false;st.picked=null;draw();window.scrollTo(0,0)};
  const tc=$('#tocards');if(tc)tc.onclick=()=>{st.tab='cards';draw();window.scrollTo(0,0)};
  const fc=$('#fc');if(fc)fc.onclick=()=>{st.flip=!st.flip;fc.classList.toggle('flip',st.flip)};
  const go=d=>{st.ci+=d;st.flip=false;draw()};
  const pv=$('#pv');if(pv)pv.onclick=()=>go(-1);const n2=$('#nx');if(n2)n2.onclick=()=>go(1);
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.know[st.ci]=b.dataset.k;save();if(st.ci<DATA[st.k].c.length-1)go(1);else draw()});
  const sf=$('#shf');if(sf)sf.onclick=()=>{const C=DATA[st.k].c,seed=Date.now()%100000;DATA[st.k].c=shuffle(C,seed);st.know={};st.ci=0;st.flip=false;save();draw()};
}
function go(h){const m=/^#t(\d+)$/.exec(h||'');if(!(m&&st&&st.k===m[1]))st=null;if(m&&DATA[m[1]])topic(m[1]);else{st=null;home()}}
function route(){go(location.hash)}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();const h=a.getAttribute('href');try{history.pushState(null,'',h==='#'?location.pathname+location.search:h)}catch(_){}go(h)});
addEventListener('hashchange',route);addEventListener('popstate',route);route();
</script></body></html>
